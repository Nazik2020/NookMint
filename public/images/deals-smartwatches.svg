<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <filter id="shadowWatch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
    <linearGradient id="sportTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="sportSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Watch 1 (Silver / White, angled left) -->
  <g transform="translate(60, 40) rotate(-15)" filter="url(#shadowWatch)">
    <!-- Straps -->
    <path d="M 55 10 L 55 70 L 105 70 L 105 10 Z" fill="url(#sportSilver)" rx="10" />
    <path d="M 55 170 L 55 240 L 105 240 L 105 170 Z" fill="url(#sportSilver)" rx="10" />
    <!-- Case -->
    <rect x="40" y="65" width="80" height="110" rx="24" fill="#334155" stroke="#CBD5E1" stroke-width="4" />
    <!-- Screen -->
    <rect x="47" y="72" width="66" height="96" rx="18" fill="url(#screenGrad)" />
    <!-- Dial UI -->
    <text x="80" y="115" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#38BDF8" text-anchor="middle">09:28</text>
    <circle cx="80" cy="142" r="12" fill="none" stroke="#22C55E" stroke-width="3" stroke-dasharray="60" stroke-dashoffset="15" />
    <text x="80" y="145" font-family="system-ui, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">84%</text>
  </g>

  <!-- Watch 2 (Neon Lime, centerpiece curved strap) -->
  <g transform="translate(190, 20)" filter="url(#shadowWatch)">
    <!-- Upper Strap -->
    <path d="M 60 0 C 60 40, 65 70, 70 80 L 110 80 C 115 70, 120 40, 120 0 Z" fill="url(#neonLime)" />
    <!-- Lower Strap with holes -->
    <path d="M 65 180 C 65 240, 100 280, 150 300 C 140 280, 115 240, 115 180 Z" fill="url(#neonLime)" />
    <circle cx="95" cy="220" r="4" fill="#4D7C0F" />
    <circle cx="105" cy="240" r="4" fill="#4D7C0F" />
    <circle cx="118" cy="260" r="4" fill="#4D7C0F" />
    <!-- Case -->
    <rect x="45" y="75" width="90" height="115" rx="26" fill="#18181B" stroke="#A3E635" stroke-width="3.5" />
    <rect x="52" y="82" width="76" height="101" rx="20" fill="url(#screenGrad)" />
    <!-- OLED Digital Display -->
    <circle cx="90" cy="132" r="32" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="140" stroke-dashoffset="30" />
    <text x="90" y="128" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">10:09</text>
    <text x="90" y="145" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#A3E635" text-anchor="middle">⚡ 324 KCAL</text>
  </g>

  <!-- Watch 3 (Teal Green, tilted right) -->
  <g transform="translate(320, 90) rotate(18)" filter="url(#shadowWatch)">
    <path d="M 55 15 L 55 70 L 105 70 L 105 15 Z" fill="url(#sportTeal)" rx="10" />
    <path d="M 55 170 L 55 235 L 105 235 L 105 170 Z" fill="url(#sportTeal)" rx="10" />
    <rect x="40" y="65" width="80" height="110" rx="24" fill="#0F172A" stroke="#2DD4BF" stroke-width="3" />
    <rect x="47" y="72" width="66" height="96" rx="18" fill="url(#screenGrad)" />
    <!-- Activity Rings -->
    <circle cx="80" cy="120" r="22" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="100" stroke-dashoffset="20" />
    <circle cx="80" cy="120" r="16" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="80" stroke-dashoffset="15" />
    <circle cx="80" cy="120" r="10" fill="none" stroke="#3B82F6" stroke-width="3" stroke-dasharray="60" stroke-dashoffset="10" />
  </g>
</svg>