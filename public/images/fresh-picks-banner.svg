<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAF5ED" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#EAF5ED" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EAF5ED" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="500" height="280" fill="url(#bgGrad)"/>

  <!-- Table Ground Shadow -->
  <ellipse cx="280" cy="250" rx="190" ry="18" fill="#000000" opacity="0.08"/>

  <!-- Crisp Leafy Romaine / Butterhead Lettuce (Left of Composition) -->
  <g transform="translate(40, 40)" filter="url(#shadow)">
    <!-- Back Leaves -->
    <path d="M 50 150 Q 10 70 80 20 Q 120 70 90 160 Z" fill="#15803D"/>
    <path d="M 80 150 Q 80 40 130 10 Q 170 60 120 160 Z" fill="#16A34A"/>
    <path d="M 110 150 Q 140 30 180 30 Q 200 90 140 160 Z" fill="#22C55E"/>
    <!-- Front Rippled Leaves -->
    <circle cx="90" cy="120" r="45" fill="#16A34A"/>
    <circle cx="120" cy="115" r="48" fill="#22C55E"/>
    <circle cx="70" cy="140" r="38" fill="#15803D"/>
    <circle cx="140" cy="135" r="42" fill="#4ADE80"/>
  </g>

  <!-- Sweet Golden Corn Cobs (Right of Composition) -->
  <g transform="translate(290, 80) rotate(35)" filter="url(#shadow)">
    <!-- Husks -->
    <path d="M -15 0 Q -25 70 -5 160 L 25 160 Q 5 70 0 0 Z" fill="#84CC16"/>
    <path d="M 35 0 Q 45 70 25 160 L -5 160 Q 15 70 20 0 Z" fill="#65A30D"/>
    <!-- Golden Corn Kernels -->
    <rect x="-8" y="15" width="36" height="135" rx="18" fill="#EAB308" stroke="#CA8A04" stroke-width="1.5"/>
    <rect x="-4" y="20" width="28" height="125" rx="14" fill="#FDE047"/>
    <!-- Kernel Grid Lines -->
    <line x1="0" y1="20" x2="0" y2="140" stroke="#CA8A04" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="10" y1="20" x2="10" y2="140" stroke="#CA8A04" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="20" y1="20" x2="20" y2="140" stroke="#CA8A04" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Vine-Ripened Red Tomatoes (Center & Front) matching Reference Image 1 -->
  <!-- Tomato Vine Stem -->
  <path d="M 170 140 Q 230 110 320 125" stroke="#15803D" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 210 128 L 215 145" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
  <path d="M 265 120 L 270 140" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>

  <!-- Tomato 1 (Large Left) -->
  <g transform="translate(170, 140)" filter="url(#shadow)">
    <circle cx="38" cy="38" r="36" fill="#DC2626" stroke="#991B1B" stroke-width="1"/>
    <circle cx="28" cy="26" r="10" fill="#EF4444" opacity="0.85"/>
    <circle cx="24" cy="22" r="4" fill="#FFFFFF" opacity="0.7"/>
    <!-- Calyx -->
    <path d="M 38 6 L 41 14 L 49 10 L 44 17 L 52 20 L 44 23 L 47 30 L 40 25 L 34 29 L 36 22 L 28 20 L 36 17 Z" fill="#15803D"/>
  </g>

  <!-- Tomato 2 (Large Center) -->
  <g transform="translate(230, 145)" filter="url(#shadow)">
    <circle cx="36" cy="36" r="34" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="26" cy="24" r="9" fill="#DC2626" opacity="0.85"/>
    <circle cx="22" cy="20" r="3.5" fill="#FFFFFF" opacity="0.7"/>
    <!-- Calyx -->
    <path d="M 36 6 L 39 14 L 47 10 L 42 17 L 50 20 L 42 23 L 45 30 L 38 25 L 32 29 L 34 22 L 26 20 L 34 17 Z" fill="#15803D"/>
  </g>

  <!-- Tomato 3 (Front Right) -->
  <g transform="translate(290, 160)" filter="url(#shadow)">
    <circle cx="28" cy="28" r="26" fill="#DC2626" stroke="#991B1B" stroke-width="1"/>
    <circle cx="20" cy="18" r="7" fill="#EF4444" opacity="0.85"/>
  </g>
</svg>
