<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="circleBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f0f7f3"/>
      <stop offset="100%" stop-color="#dcefe4"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#circleBg)"/>

  <!-- Ground Shadow -->
  <ellipse cx="150" cy="265" rx="90" ry="14" fill="#000000" opacity="0.12"/>

  <g transform="translate(45, 45)" filter="url(#shadow)">
    <!-- Wooden Clothing Rail / Rack matching Reference Image 1 -->
    <line x1="15" y1="40" x2="195" y2="40" stroke="#B45309" stroke-width="6" stroke-linecap="round"/>

    <!-- Wooden Clothes Hangers -->
    <path d="M 50 43 L 70 65 L 30 65 Z" fill="none" stroke="#D97706" stroke-width="2"/>
    <path d="M 105 43 L 125 65 L 85 65 Z" fill="none" stroke="#D97706" stroke-width="2"/>
    <path d="M 160 43 L 180 65 L 140 65 Z" fill="none" stroke="#D97706" stroke-width="2"/>

    <!-- Shirt 3 (Charcoal/Dark Grey Shirt on Right) -->
    <path d="M 140 65 L 180 65 L 188 175 L 132 175 Z" fill="#334155" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Shirt 2 (Sage Green Shirt in Middle) -->
    <path d="M 85 65 L 125 65 L 133 175 L 77 175 Z" fill="#64748B" stroke="#475569" stroke-width="1"/>

    <!-- Shirt 1 (Crisp Off-White / Natural Linen Shirt on Left) matching Reference Image 1 -->
    <path d="M 30 65 L 70 65 L 78 180 L 22 180 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Button Column -->
    <line x1="50" y1="65" x2="50" y2="180" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="50" cy="90" r="2" fill="#64748B"/>
    <circle cx="50" cy="115" r="2" fill="#64748B"/>
    <circle cx="50" cy="140" r="2" fill="#64748B"/>

    <!-- Folded Knitwear Stack Below matching Reference Image 1 -->
    <rect x="75" y="178" width="95" height="18" rx="6" fill="#FBCFE8" stroke="#F472B6" stroke-width="1"/>
    <rect x="70" y="193" width="105" height="20" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  </g>
</svg>
