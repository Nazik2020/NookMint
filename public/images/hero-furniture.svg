<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <radialGradient id="archGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2ECE9" />
      <stop offset="100%" stop-color="#CFDFDA" />
    </radialGradient>
    <linearGradient id="chairYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="armRest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    <filter id="shadowLamp" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Pastel Arch Circle -->
  <circle cx="260" cy="220" r="160" fill="url(#archGrad)" />
  <ellipse cx="260" cy="410" rx="190" ry="22" fill="#E2E8F0" opacity="0.6" />

  <!-- Monstera Plant in Background -->
  <g opacity="0.85">
    <path d="M 240 230 C 210 180, 230 110, 250 80 C 265 120, 275 170, 255 230 Z" fill="#2E7D32" />
    <path d="M 250 80 Q 235 120 220 130" stroke="#1B5E20" stroke-width="2" fill="none" />
    <path d="M 250 80 Q 265 110 280 120" stroke="#1B5E20" stroke-width="2" fill="none" />
    <path d="M 220 250 C 190 200, 200 130, 220 100 C 240 140, 245 190, 230 250 Z" fill="#388E3C" />
    <path d="M 265 240 C 275 190, 290 140, 310 120 C 310 160, 300 200, 275 240 Z" fill="#1B5E20" />
    <!-- White Plant Pot -->
    <path d="M 235 250 L 255 250 L 252 280 L 238 280 Z" fill="#FFFFFF" filter="url(#shadowSoft)" />
  </g>

  <!-- Brass Standing Floor Lamp -->
  <g filter="url(#shadowLamp)">
    <!-- Base -->
    <ellipse cx="450" cy="405" rx="36" ry="7" fill="url(#brassGold)" />
    <!-- Stem with Angle -->
    <path d="M 450 405 L 450 180 L 400 100" stroke="url(#brassGold)" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Joint Knob -->
    <circle cx="450" cy="180" r="6" fill="#854D0E" />
    <!-- Cone Shade -->
    <path d="M 390 90 L 415 110 L 430 85 L 405 65 Z" fill="url(#brassGold)" />
    <!-- Light Glow -->
    <polygon points="380,105 270,300 370,300" fill="#FEF08A" opacity="0.15" />
  </g>

  <!-- Yellow Accent Armchair (Main Focal Subject) -->
  <g filter="url(#shadowSoft)">
    <!-- Chair Legs -->
    <line x1="165" y1="360" x2="145" y2="420" stroke="#78350F" stroke-width="6" stroke-linecap="round" />
    <line x1="335" y1="360" x2="355" y2="420" stroke="#78350F" stroke-width="6" stroke-linecap="round" />
    <line x1="195" y1="365" x2="185" y2="425" stroke="#451A03" stroke-width="5" stroke-linecap="round" />
    <line x1="305" y1="365" x2="315" y2="425" stroke="#451A03" stroke-width="5" stroke-linecap="round" />

    <!-- Back Cushion -->
    <path d="M 170 210 C 170 140, 330 140, 330 210 L 330 320 C 330 330, 170 330, 170 320 Z" fill="url(#chairYellow)" />
    <!-- Tufted Buttons -->
    <circle cx="220" cy="200" r="4.5" fill="#A16207" />
    <circle cx="280" cy="200" r="4.5" fill="#A16207" />
    <circle cx="220" cy="250" r="4.5" fill="#A16207" />
    <circle cx="280" cy="250" r="4.5" fill="#A16207" />

    <!-- Thick Seat Cushion -->
    <rect x="150" y="305" width="200" height="55" rx="20" fill="url(#chairYellow)" />
    <path d="M 150 330 Q 250 345 350 330 L 350 345 Q 250 360 150 345 Z" fill="#CA8A04" />

    <!-- Cylindrical Bolster Armrests (Wooden accent) -->
    <!-- Left Armrest -->
    <rect x="125" y="290" width="45" height="30" rx="14" fill="url(#chairYellow)" />
    <ellipse cx="125" cy="305" rx="10" ry="14" fill="url(#armRest)" />
    <!-- Right Armrest -->
    <rect x="330" y="290" width="45" height="30" rx="14" fill="url(#chairYellow)" />
    <ellipse cx="375" cy="305" rx="10" ry="14" fill="url(#armRest)" />
  </g>
</svg>