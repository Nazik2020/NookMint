<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDF3EA" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#FDF3EA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FDF3EA" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Sage Green T-Shirt Gradient -->
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#738a74"/>
      <stop offset="50%" stop-color="#5a735c"/>
      <stop offset="100%" stop-color="#425844"/>
    </linearGradient>
    <!-- Warm Beige / Oatmeal T-Shirt Gradient -->
    <linearGradient id="beigeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebe3d7"/>
      <stop offset="50%" stop-color="#ded4c3"/>
      <stop offset="100%" stop-color="#c9bca8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="500" height="280" fill="url(#bgGrad)"/>

  <!-- Table Ground Shadow -->
  <ellipse cx="300" cy="245" rx="170" ry="20" fill="#000000" opacity="0.10"/>

  <!-- Beige / Sand T-Shirt (Underneath on Right) -->
  <g transform="translate(250, 40) rotate(15)" filter="url(#shadow)">
    <!-- Main Folded Shirt -->
    <rect x="0" y="30" width="160" height="180" rx="14" fill="url(#beigeGrad)" stroke="#baa992" stroke-width="1.5"/>
    <!-- Fold Lines -->
    <line x1="20" y1="30" x2="20" y2="210" stroke="#baa992" stroke-width="1.5"/>
    <line x1="140" y1="30" x2="140" y2="210" stroke="#baa992" stroke-width="1.5"/>
    <!-- Crew Neckline -->
    <path d="M 50 30 Q 80 55 110 30 Z" fill="#cfc2ad" stroke="#baa992" stroke-width="1.5"/>
    <path d="M 52 30 Q 80 50 108 30" stroke="#f5efe6" stroke-width="3" fill="none"/>
    <!-- Minimalist Tag -->
    <rect x="120" y="70" width="22" height="30" rx="2" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  </g>

  <!-- Sage Green Cotton T-Shirt (Foreground on Left) matching Reference Image 1 -->
  <g transform="translate(110, 35) rotate(-8)" filter="url(#shadow)">
    <!-- Main Folded Shirt -->
    <rect x="0" y="25" width="175" height="195" rx="16" fill="url(#sageGrad)" stroke="#394c3a" stroke-width="1.5"/>
    <!-- Subtle Side Crease Folds -->
    <line x1="22" y1="25" x2="22" y2="220" stroke="#394c3a" stroke-width="1.5"/>
    <line x1="153" y1="25" x2="153" y2="220" stroke="#394c3a" stroke-width="1.5"/>
    <line x1="0" y1="185" x2="175" y2="185" stroke="#394c3a" stroke-width="1"/>
    <!-- Crew Neck Collar Ribbing matching Reference Image 1 -->
    <path d="M 50 25 Q 87 55 125 25 Z" fill="#394c3a" stroke="#2c3b2d" stroke-width="1.5"/>
    <path d="M 52 25 Q 87 50 122 25" stroke="#8fa890" stroke-width="3.5" fill="none"/>
    <!-- Fabric Sheen Highlight -->
    <path d="M 28 35 L 28 175" stroke="#8fa890" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
