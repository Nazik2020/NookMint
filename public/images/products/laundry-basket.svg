<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8faf9"/>
    </radialGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="30%" stop-color="#f5efe6"/>
      <stop offset="70%" stop-color="#e8dec8"/>
      <stop offset="100%" stop-color="#d4c5a9"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8dec8"/>
    </linearGradient>
    <radialGradient id="interiorGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a89a80"/>
      <stop offset="100%" stop-color="#6e624c"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="355" rx="115" ry="16" fill="#000000" opacity="0.12"/>
  <ellipse cx="200" cy="354" rx="80" ry="10" fill="#000000" opacity="0.15"/>

  <g filter="url(#shadow)">
    <!-- Basket Rim & Interior Depth matching Reference Image 1 -->
    <path d="M 85 150 L 315 150 L 295 330 Q 295 345 270 345 L 130 345 Q 105 345 105 330 Z" fill="url(#basketGrad)" stroke="#c4b59b" stroke-width="1.5"/>

    <!-- Top Rim Frame -->
    <ellipse cx="200" cy="150" rx="115" ry="26" fill="url(#rimGrad)" stroke="#b5a489" stroke-width="1.5"/>
    <ellipse cx="200" cy="150" rx="103" ry="20" fill="url(#interiorGrad)"/>

    <!-- Cutout Handles on Sides -->
    <rect x="165" y="172" width="70" height="18" rx="9" fill="#8c7d65" stroke="#fdfbf7" stroke-width="2"/>
    <rect x="168" y="174" width="64" height="14" rx="7" fill="#524838"/>

    <!-- Modern Diamond / Lattice Ventilation Grid Holes matching Reference Image 1 -->
    <!-- Row 1 -->
    <g fill="#8c7d65" opacity="0.75">
      <rect x="125" y="210" width="12" height="12" rx="2"/>
      <rect x="145" y="210" width="12" height="12" rx="2"/>
      <rect x="165" y="210" width="12" height="12" rx="2"/>
      <rect x="185" y="210" width="12" height="12" rx="2"/>
      <rect x="205" y="210" width="12" height="12" rx="2"/>
      <rect x="225" y="210" width="12" height="12" rx="2"/>
      <rect x="245" y="210" width="12" height="12" rx="2"/>
      <rect x="265" y="210" width="12" height="12" rx="2"/>

      <!-- Row 2 -->
      <rect x="130" y="235" width="12" height="12" rx="2"/>
      <rect x="150" y="235" width="12" height="12" rx="2"/>
      <rect x="170" y="235" width="12" height="12" rx="2"/>
      <rect x="190" y="235" width="12" height="12" rx="2"/>
      <rect x="210" y="235" width="12" height="12" rx="2"/>
      <rect x="230" y="235" width="12" height="12" rx="2"/>
      <rect x="250" y="235" width="12" height="12" rx="2"/>

      <!-- Row 3 -->
      <rect x="135" y="260" width="12" height="12" rx="2"/>
      <rect x="155" y="260" width="12" height="12" rx="2"/>
      <rect x="175" y="260" width="12" height="12" rx="2"/>
      <rect x="195" y="260" width="12" height="12" rx="2"/>
      <rect x="215" y="260" width="12" height="12" rx="2"/>
      <rect x="235" y="260" width="12" height="12" rx="2"/>
      <rect x="255" y="260" width="12" height="12" rx="2"/>

      <!-- Row 4 -->
      <rect x="140" y="285" width="12" height="12" rx="2"/>
      <rect x="160" y="285" width="12" height="12" rx="2"/>
      <rect x="180" y="285" width="12" height="12" rx="2"/>
      <rect x="200" y="285" width="12" height="12" rx="2"/>
      <rect x="220" y="285" width="12" height="12" rx="2"/>
      <rect x="240" y="285" width="12" height="12" rx="2"/>
    </g>

    <!-- Bottom Base Band -->
    <path d="M 115 325 L 285 325 L 280 345 L 120 345 Z" fill="#b5a489" opacity="0.6"/>
  </g>
</svg>
