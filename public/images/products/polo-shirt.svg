<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8faf9"/>
    </radialGradient>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="foldShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="355" rx="100" ry="14" fill="#000000" opacity="0.10"/>
  <ellipse cx="200" cy="354" rx="70" ry="8" fill="#000000" opacity="0.14"/>

  <g filter="url(#shadow)">
    <!-- Main Folded Shirt Body -->
    <rect x="110" y="140" width="180" height="205" rx="10" fill="url(#fabricGrad)" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Subtle Side Fold Shadows -->
    <path d="M 110 140 L 130 140 L 130 345 L 110 345 Z" fill="url(#foldShadow)"/>
    <path d="M 290 140 L 270 140 L 270 345 L 290 345 Z" fill="url(#foldShadow)"/>

    <!-- Fold Crease Lines -->
    <line x1="130" y1="140" x2="130" y2="345" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="270" y1="140" x2="270" y2="345" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="110" y1="310" x2="290" y2="310" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Folded Polo Placket -->
    <rect x="187" y="135" width="26" height="85" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Buttons on Placket -->
    <circle cx="200" cy="155" r="3.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="200" cy="180" r="3.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="200" cy="205" r="3.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <!-- Thread cross in buttons -->
    <line x1="198.5" y1="155" x2="201.5" y2="155" stroke="#64748B" stroke-width="0.8"/>
    <line x1="198.5" y1="180" x2="201.5" y2="180" stroke="#64748B" stroke-width="0.8"/>
    <line x1="198.5" y1="205" x2="201.5" y2="205" stroke="#64748B" stroke-width="0.8"/>

    <!-- Polo Collar Wings matching Reference Image 1 -->
    <!-- Left Collar Leaf -->
    <path d="M 200 95 L 145 135 L 187 148 L 200 135 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Right Collar Leaf -->
    <path d="M 200 95 L 255 135 L 213 148 L 200 135 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Inner Collar Band / Stand -->
    <path d="M 165 105 Q 200 120 235 105 L 235 95 Q 200 110 165 95 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    <!-- Woven Brand Tag inside Collar -->
    <rect x="186" y="98" width="28" height="15" fill="#004D40" rx="1"/>
    <text x="200" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="5" fill="#FFFFFF">PREMIUM</text>

    <!-- Embroidered Chest Emblem / Crown matching Reference Image 1 -->
    <g transform="translate(150, 195)">
      <path d="M 0 8 L 4 0 L 8 5 L 12 0 L 16 8 Z" fill="#004D40"/>
      <rect x="0" y="9" width="16" height="2" fill="#004D40" rx="0.5"/>
    </g>

    <!-- Tag Label attached with string -->
    <line x1="260" y1="140" x2="275" y2="175" stroke="#94A3B8" stroke-width="1"/>
    <rect x="260" y="175" width="28" height="42" rx="2" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="274" cy="180" r="1.5" fill="#6B7280"/>
    <text x="274" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="6" fill="#004D40">100%</text>
    <text x="274" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="4.5" fill="#374151">COTTON</text>
  </g>
</svg>
